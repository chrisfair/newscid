name: newscid
base: core24
version: '1.3.30'
summary: Chess Information Database (Scid v4 compatible)
description: |
  NewScid is a Scid v4 database-compatible chess application built with Wails v2
  (Go backend) and Vue 3 (TypeScript).
  
  Features include:
  - Native binary support for .si4 (Index), .sn4 (NameBase), and .sg4 (Game Data) databases.
  - PGN parser and exporter with variations and annotation support.
  - Opening Tree Explorer calculating move frequencies and score percentages.
  - UCI chess engine analysis with evaluation graphs and blunder alerts.
  - Tactical puzzle trainer and database puzzle extraction.
  - Customizable board themes and 17 vector piece sets.

grade: stable
confinement: strict

architectures:
  - build-on: amd64

apps:
  newscid:
    command: usr/bin/newscid
    desktop: usr/share/applications/newscid.desktop
    extensions: [gnome]
    plugs:
      - home
      - network
      - opengl
      - wayland
      - x11
      - desktop
      - desktop-legacy
      - audio-playback

parts:
  newscid:
    plugin: dump
    source: build/staging/snap/stage
    organize:
      newscid: usr/bin/newscid
    stage:
      - usr/bin/newscid
      - usr/share/applications/newscid.desktop
      - usr/share/icons/hicolor
      - usr/share/metainfo/org.newscid.NewScid.metainfo.xml
