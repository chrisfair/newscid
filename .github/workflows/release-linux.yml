name: Release Linux Binaries (x86_64 & aarch64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.1.1)'
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux GTK3 / WebKit2GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev python3-pil

      - name: Build and stage Linux tarball
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION=$(tr -d ' \n\r' < VERSION)
          (cd frontend && npm ci)
          make build
          STAGE="${RUNNER_TEMP}/newscid-stage"
          rm -rf "${STAGE}" && mkdir -p "${STAGE}"
          make install DESTDIR="${STAGE}" PREFIX="/usr"
          tar -czf "newscid-${VERSION}-linux-${ARCH}.tar.gz" -C "${STAGE}" usr
          sha256sum "newscid-${VERSION}-linux-${ARCH}.tar.gz"

      - name: Upload asset to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION=$(tr -d ' \n\r' < VERSION)
          TAG="v${VERSION}"
          ASSET="newscid-${VERSION}-linux-${ARCH}.tar.gz"
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --title "NewScid ${TAG}" --generate-notes
          fi
          gh release upload "${TAG}" "${ASSET}" --clobber
